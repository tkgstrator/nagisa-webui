# ---- 共通設定 ----

name = "anime-tracker-staging"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat_v2"]

[placement]
region = "aws:us-east-1"

[vars]
CF_ACCESS_CLIENT_ID = "cfdfd7d6e420692d0d5a04db0872e875.access"
BACKEND_URL = "https://nagisa-backend.tkgstrator.work"
LAMBDA_FUNCTION_URL = "https://esxey6x7zbx2c3fdm6kkla4v4q0ftaol.lambda-url.ap-northeast-1.on.aws/"
LAMBDA_FUNCTION_URL_US = "https://ytyebcratcyemkikzh3427i7eu0lasjk.lambda-url.us-east-1.on.aws/"
WORKER_NAME = "anime-tracker-staging"

[assets]
directory = "dist/client"
not_found_handling = "single-page-application"
binding = "ASSETS"
run_worker_first = ["/api/*", "/__scheduled", "/anime/*"]

[[kv_namespaces]]
binding = "KV"
id = "0b06ce4894a344b4b041751dfa0b22ba"

# 画像永続化用。元バイナリと変換済み WebP を保存する (staging/production 共用)
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "nagisa-images"

[[d1_databases]]
binding = "DB"
database_name = "anime-tracker-staging"
database_id = "e1e78f23-da35-4d74-8de0-667a8d7ddefc"
migrations_dir = "prisma/migrations"
migrations_pattern = "prisma/migrations/*/migration.sql"

[observability]
enabled = true
head_sampling_rate = 1

[triggers]
# "* * * * *" = 録画ジョブの追従 (queue snapshot)、"*/15 * * * *" = 台帳の差分取り込み。
# ここに書いた文字列がそのまま event.cron に来るので、scheduled.ts の分岐と一字一句合わせること。
crons = ["* * * * *", "*/15 * * * *", "0 */1 * * *", "0 0 * * *", "0 3 * * *", "0 4 * * *", "0 5 * * SUN"]

# Amazon 専用 queue。スクレイピング先を叩きすぎてスロットル(200で headerDetail 欠落)される
# のを防ぐため、他 provider と分離した上で並行数を最も絞る (batch 2 × concurrency 1 = 実効 2)。
# 以前は sync queue を共有し max_concurrency = 2 (実効 10) だったが、Amazon の遅さが同じ
# batch の他 provider (hulu/crunchyroll/abema) を head-of-line blocking で待たせていたため分離した。
[[queues.producers]]
binding = "AMAZON_QUEUE"
queue = "anime-tracker-amazon-staging"

[[queues.consumers]]
queue = "anime-tracker-amazon-staging"
max_batch_size = 2
max_retries = 3
max_concurrency = 1
dead_letter_queue = "anime-tracker-amazon-dlq-staging"

# hulu / crunchyroll / abema 共有 queue。Amazon 分離後も従来の実効並列度 (batch 5 × concurrency 2 = 10) を維持。
[[queues.producers]]
binding = "SYNC_QUEUE"
queue = "anime-tracker-sync-staging"

[[queues.consumers]]
queue = "anime-tracker-sync-staging"
max_batch_size = 5
max_retries = 3
max_concurrency = 2
dead_letter_queue = "anime-tracker-sync-dlq-staging"

[[queues.producers]]
binding = "WARM_QUEUE"
queue = "anime-tracker-warm-staging"

[[queues.consumers]]
queue = "anime-tracker-warm-staging"
max_batch_size = 3
max_retries = 3
max_concurrency = 3
dead_letter_queue = "anime-tracker-warm-dlq-staging"

[dev]
port = 8787
ip = "0.0.0.0"
local_protocol = "http"

# ---- Staging ----

[env.staging]
name = "anime-tracker-staging"
workers_dev = false
preview_urls = false
routes = [{ pattern = "nagisa-staging.tkgstrator.work", custom_domain = true }]

[env.staging.vars]
# 生ログタブが Workers Logs を $metadata.service で絞るのに使う (src/lib/observability.ts)。
# CF_ACCOUNT_ID / CF_OBSERVABILITY_TOKEN は secret。
WORKER_NAME = "anime-tracker-staging"
CF_ACCESS_CLIENT_ID = "cfdfd7d6e420692d0d5a04db0872e875.access"
BACKEND_URL = "https://nagisa-backend.tkgstrator.work"
LAMBDA_FUNCTION_URL = "https://esxey6x7zbx2c3fdm6kkla4v4q0ftaol.lambda-url.ap-northeast-1.on.aws/"
LAMBDA_FUNCTION_URL_US = "https://ytyebcratcyemkikzh3427i7eu0lasjk.lambda-url.us-east-1.on.aws/"

[[env.staging.kv_namespaces]]
binding = "KV"
id = "0b06ce4894a344b4b041751dfa0b22ba"

[[env.staging.r2_buckets]]
binding = "IMAGES"
bucket_name = "nagisa-images"

[[env.staging.d1_databases]]
