migrations_pattern = "prisma/migrations/*/migration.sql"

# Amazon 専用 queue。他 provider の head-of-line blocking を防ぐため分離し、並行数を最も絞る (実効 2)。詳細は共通設定側のコメント参照。
[[env.staging.queues.producers]]
binding = "AMAZON_QUEUE"
queue = "anime-tracker-amazon-staging"

[[env.staging.queues.consumers]]
queue = "anime-tracker-amazon-staging"
max_batch_size = 2
max_retries = 3
max_concurrency = 1
dead_letter_queue = "anime-tracker-amazon-dlq-staging"

# hulu / crunchyroll / abema 共有 queue。実効並列度は従来通り 10 (batch 5 × concurrency 2)。
[[env.staging.queues.producers]]
binding = "SYNC_QUEUE"
queue = "anime-tracker-sync-staging"

[[env.staging.queues.consumers]]
queue = "anime-tracker-sync-staging"
max_batch_size = 5
max_retries = 3
max_concurrency = 2
dead_letter_queue = "anime-tracker-sync-dlq-staging"

[[env.staging.queues.producers]]
binding = "WARM_QUEUE"
queue = "anime-tracker-warm-staging"

[[env.staging.queues.consumers]]
queue = "anime-tracker-warm-staging"
max_batch_size = 3
max_retries = 3
max_concurrency = 3
dead_letter_queue = "anime-tracker-warm-dlq-staging"

