# mock-diff-viewer の画面定義ファイル。
#
# viewer sidecar (docker compose の mock-diff サービス) がこのファイルを読み込み、
# デザイン候補の選定(Deciding)・実装との比較(Checking)を行う。
#
# スキーマの要点:
#   screens[].id            画面を一意に識別する ID (URL やコマンドで指定する)
#   screens[].name           画面の表示名
#   screens[].threshold      実装とデザインのピクセル差分許容値 (0-1、小さいほど厳密)。
#                             screen 単位が基本だが devices[] 単位で個別に上書きもできる
#   screens[].devices[].id           デバイスを一意に識別する ID
#   screens[].devices[].name         デバイスの表示名
#   screens[].devices[].viewport     width / height / deviceScaleFactor
#   screens[].devices[].orientations portrait / landscape の組み合わせ
#   screens[].devices[].versions     デザイン候補 (キーがバリアント名)。
#                                     type: html | png | url のいずれかを指定。
#                                     html / png は path (workspace 相対) を、
#                                     url は稼働中のページを指す url を指定する
#   screens[].devices[].actual       実装結果。type: url で稼働中アプリの URL を指定するのが基本
#                                     (このリポジトリでは devcontainer 内の vite dev server
#                                     の 14755 番を指すことを想定)
#
# ホストが compose のサービス名 `app` ではなくコンテナ名なのは、Chromium が `.app` gTLD を
# HSTS preload リストに丸ごと載せていて単一ラベルの `app` もこれに一致するため。
# http://app:14755/ は問答無用で https:// に昇格され、TLS を話さない vite dev server では
# 撮影が net::ERR_SSL_PROTOCOL_ERROR で必ず落ちる。コンテナ名はこの gTLD に当たらない。
# なお vite 5.4.12 以降は Host ヘッダが localhost 以外だと既定で 403 になるので、
# このホスト名は vite.config.ts の server.allowedHosts にも入れてある。
#
# 画面を追加する場合は screens 配列にエントリを足し、
# mocks/ (デザイン原案) / variants/ (候補違い) / actual/ (実装のスナップショット) に
# 対応するファイルを配置する。詳細は docs/mock-diff.md を参照。
screens:
  - id: browse
    name: アニメ一覧
    category: ページ
    threshold: 0.1
    devices:
      - id: desktop
        name: Desktop
        viewport:
          width: 1440
          height: 900
          deviceScaleFactor: 1
        orientations: [landscape]
        versions:
          fable:
            type: html
            path: mocks/browse-fable.html
          astra:
            type: html
            path: mocks/browse-astra.html
          final:
            type: html
            path: mocks/browse-final.html
        actual:
          type: url
          url: http://nagisa-webui_devcontainer-app-1:14755/browse
      - id: iphone
        name: iPhone
        viewport:
          width: 390
          height: 844
          deviceScaleFactor: 1
        orientations: [portrait]
        versions:
