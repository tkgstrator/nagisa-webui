services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - node_modules:/home/vscode/app/node_modules
      - cache:/home/vscode/app/.cache
      # VS Code server の拡張はコンテナ FS に入るのでリビルドで消える。/vscode 配下に
      # 残るのは .vsix のダウンロードキャッシュだけで、何を入れるかを決めている
      # extensions.json はここにあるため、このディレクトリごと永続化する。
      - vscode_extensions:/home/vscode/.vscode-server/extensions
      - ../:/home/vscode/app:cached
    environment:
      NODE_OPTIONS: "--no-deprecation"
    tty: true
    stdin_open: true

  # デザイン候補の選定(Deciding)・実装(Building)・ピクセル差分検証(Checking)を行う
  # mock-diff-viewer sidecar。詳細は docs/mock-diff.md を参照。
  #
  # ports は宣言しない。ホストへの公開は VS Code の自動フォワードに任せる
  # (devcontainer.json の forwardPorts)。空いていなければ VS Code が別のローカルポートを
  # 選ぶので、mock-diff sidecar を持つ repo を何個同時に立てても衝突しない
  # (固定の公開ポートだとここが割れる)。なお vite の server.proxy 経由で覗く構成は
  # 成立しない。viewer の client が /api/screens などルート相対 URL を出すため、アプリ側
  # Worker の /api ルートに先に捕まって Hono が 404 を返し、UI が空になる。
  #
  # network_mode が効いているのは撮影経路の一点だけ。app のネットワーク名前空間を共有すると
  # viewer の Playwright は http://localhost:14755/ で dev server に届き、compose の
  # サービス名もエイリアスも一切要らなくなる。ホスト名を使う経路には罠が二つある:
  # (1) Chromium は `.app` gTLD を HSTS preload list に丸ごと載せていて単一ラベルの `app` も
  # これに一致するため、http://app:14755/ は https に昇格され、TLS を話さない vite は
  # net::ERR_SSL_PROTOCOL_ERROR になる。(2) vite 5.4.12 以降は Host ヘッダが localhost 以外
  # だと既定で 403 なので server.allowedHosts への追記が要る。localhost はどちらも最初から
  # 関係ない。副作用として MOCK_DIFF_URL も http://localhost:3000 になる
  # (名前空間を分ければ http://mock-diff:3000 でも届く)。
  mock-diff:
    image: ghcr.io/qtmleap/mock-diff-viewer:latest
    network_mode: "service:app"
    volumes:
      - ../docs/mock-diff:/workspace
      - mock_diff_data:/data
    init: true

volumes:
  node_modules:
    driver: local
  cache:
    driver: local
  vscode_extensions:
    driver: local
  mock_diff_data:
    driver: local
