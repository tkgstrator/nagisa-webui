services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - node_modules:/home/vscode/app/node_modules
      - cache:/home/vscode/app/.cache
      # VS Code server の拡張はコンテナ FS に入るのでリビルドで消える。/vscode 配下に
      # 残るのは .vsix のダウンロードキャッシュだけで、何を入れるかを決めている
      # extensions.json はここにあるため、このディレクトリごと永続化する。
      - vscode_extensions:/home/vscode/.vscode-server/extensions
      - ../:/home/vscode/app:cached
    environment:
      NODE_OPTIONS: "--no-deprecation"
    tty: true
    stdin_open: true

  # デザイン候補の選定(Deciding)・実装(Building)・ピクセル差分検証(Checking)を行う
  # mock-diff-viewer sidecar。詳細は docs/mock-diff.md を参照。
  #
  # ports は宣言しない。app のネットワーク名前空間を共有しているので viewer の 3000 番は
  # devcontainer 自身が listen しているのと同じに見え、VS Code の自動フォワードがホストに
  # 出してくれる。空いていなければ VS Code が別のローカルポートを選ぶので、mock-diff
  # sidecar を持つ repo を何個同時に立てても衝突しない (固定の公開ポートだとここが割れる)。
  # なお vite の server.proxy 経由で覗く構成は成立しない。viewer の client が /api/screens
  # などルート相対 URL を出すため、アプリ側 Worker の /api ルートに先に捕まって Hono が
  # 404 を返し、UI が空になる。
  #
  # app のネットワーク名前空間をそのまま共有する。こうすると viewer の Playwright は
  # http://localhost:14755/ で dev server に届き、compose のサービス名もエイリアスも
  # 一切要らなくなる。ホスト名を使う経路には罠がある: Chromium は `.app` gTLD を HSTS
  # preload list に丸ごと載せていて単一ラベルの `app` もこれに一致するため、
  # http://app:14755/ は https に昇格され、TLS を話さない vite は
  # net::ERR_SSL_PROTOCOL_ERROR になる。localhost は昇格対象外で、vite の
  # server.allowedHosts も素通しするので、この経路だけが追加設定なしで成立する。
  # Claude Code (mock-diff MCP プラグイン) も同じ名前空間にいるので
  # devcontainer.json の containerEnv.MOCK_DIFF_URL=http://localhost:3000 で届く。
  mock-diff:
    image: ghcr.io/qtmleap/mock-diff-viewer:latest
    network_mode: "service:app"
    volumes:
      - ../docs/mock-diff:/workspace
      - mock_diff_data:/data
    init: true

volumes:
  node_modules:
    driver: local
  cache:
    driver: local
  vscode_extensions:
    driver: local
  mock_diff_data:
    driver: local
