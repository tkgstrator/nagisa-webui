services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - node_modules:/home/vscode/app/node_modules
      - cache:/home/vscode/app/.cache
      # VS Code server の拡張はコンテナ FS に入るのでリビルドで消える。/vscode 配下に
      # 残るのは .vsix のダウンロードキャッシュだけで、何を入れるかを決めている
      # extensions.json はここにあるため、このディレクトリごと永続化する。
      - vscode_extensions:/home/vscode/.vscode-server/extensions
      - ../:/home/vscode/app:cached
    environment:
      NODE_OPTIONS: "--no-deprecation"
    tty: true
    stdin_open: true

  # デザイン候補の選定(Deciding)・実装(Building)・ピクセル差分検証(Checking)を行う
  # mock-diff-viewer sidecar。詳細は docs/mock-diff.md を参照。
  #
  # ホスト側公開ポートは 12555:3000 (ブラウザから http://localhost:12555 で直接閲覧する用)。
  # Claude Code (mock-diff MCP プラグイン) からはホスト側ポートを経由せず、
  # devcontainer.json の containerEnv.MOCK_DIFF_URL=http://mock-diff:3000 で
  # compose ネットワーク内のサービス名 (mock-diff) とコンテナ内部の固定ポート (3000) に
  # 直接名前解決して接続する。ホスト公開ポートの番号はこの接続経路には影響しない。
  mock-diff:
    image: ghcr.io/qtmleap/mock-diff-viewer:latest
    volumes:
      - ../docs/mock-diff:/workspace
      - mock_diff_data:/data
    init: true

volumes:
  node_modules:
    driver: local
  cache:
    driver: local
  vscode_extensions:
    driver: local
  mock_diff_data:
    driver: local
