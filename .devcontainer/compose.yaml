services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - node_modules:/home/vscode/app/node_modules
      - cache:/home/vscode/app/.cache
      # VS Code server の拡張はコンテナ FS に入るのでリビルドで消える。/vscode 配下に
      # 残るのは .vsix のダウンロードキャッシュだけで、何を入れるかを決めている
      # extensions.json はここにあるため、このディレクトリごと永続化する。
      - vscode_extensions:/home/vscode/.vscode-server/extensions
      - ../:/home/vscode/app:cached
    environment:
      NODE_OPTIONS: "--no-deprecation"
    # mock-diff の Playwright (Chromium) から dev server を引くための別名。
    # Chromium は `.app` gTLD を HSTS preload リストに丸ごと載せているので、compose の
    # サービス名そのままの `app` へ http:// で入ると問答無用で https:// に昇格され、TLS を
    # 話さない vite は net::ERR_SSL_PROTOCOL_ERROR を返す。preload に載っていない別名を
    # 足して撮影側 (docs/mock-diff/mock-diff.yaml の actual URL) はこちらを使う。
    networks:
      default:
        aliases:
          - webui
    tty: true
    stdin_open: true

  # デザイン候補の選定(Deciding)・実装(Building)・ピクセル差分検証(Checking)を行う
  # mock-diff-viewer sidecar。詳細は docs/mock-diff.md を参照。
  #
  # ホストのブラウザからは http://localhost:14756 で直接開く。vite の server.proxy 経由で
  # 覗く構成は成立しない。viewer の client が /api/screens などルート相対 URL を出すため、
  # アプリ側 Worker の /api ルートに先に捕まって Hono が 404 を返し、UI が空になる。
  #
  # ポート番号は「vite の port (14755) + 1」。mock-diff sidecar を持つ repo を複数同時に
  # 起動するため固定値だと衝突する。vite の port は repo ごとに固有なので +1 も固有になる。
  # Claude Code (mock-diff MCP プラグイン) は devcontainer.json の
  # containerEnv.MOCK_DIFF_URL=http://mock-diff:3000 を使い、compose ネットワーク内の
  # サービス名 (mock-diff) とコンテナ内部の固定ポート (3000) に直接名前解決して接続する。
  # サービス名はホストからは名前解決できないので、ホストでこの URL を叩いても繋がらない。
  mock-diff:
    image: ghcr.io/qtmleap/mock-diff-viewer:latest
    ports:
      - "14756:3000"
    volumes:
      - ../docs/mock-diff:/workspace
      - mock_diff_data:/data
    init: true

volumes:
  node_modules:
    driver: local
  cache:
    driver: local
  vscode_extensions:
    driver: local
  mock_diff_data:
    driver: local
