<!doctype html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Nagisa</title>
  <meta name="description" content="Prime Video / Hulu / Netflix のアニメ録画状況を管理するアプリ" />
  <meta name="theme-color" content="#09090b" />
  <!--
    初回描画前にテーマを確定させる。設定 (localStorage: nagisa-settings) の theme を読み、
    'system' なら OS の配色に追従する。ここで当てないと JS が走るまでの一瞬だけ
    別のテーマが見えてしまう (FOUC)。適用ロジックは
    src/app/routes/settings/-lib/settings.ts の applyTheme と同じ。
  -->
  <script>
    (function () {
      var dark = true
      try {
        var raw = localStorage.getItem('nagisa-settings')
        var theme = raw ? (JSON.parse(raw) || {}).theme || 'system' : 'system'
        dark = theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
      } catch (e) {
        dark = matchMedia('(prefers-color-scheme: dark)').matches
      }
      document.documentElement.classList.toggle('dark', dark)
      document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
    })()
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/app/main.tsx"></script>
</body>

</html>
